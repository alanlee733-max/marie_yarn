<meta charset="utf-8">
<title>marie yarn</title>

<style>
/* =========================================================
   marie yarn — v1 stylesheet
   따뜻한 뉴트럴 위에 실 색만 살리는 것이 이 디자인의 원칙.
   UI가 채도를 가지면 실 색이 죽는다.
   ========================================================= */

/* ---------- tokens ---------- */
:root {
  --bg: #faf8f5;
  --surface: #ffffff;
  --surface-2: #f2ede6;
  --surface-3: #e9e2d8;

  --ink: #23201c;
  --ink-2: #5c554b;
  --ink-3: #8d8478;
  --line: #e3dbd0;
  --line-2: #d3c9bb;

  --accent: #9c5b44;
  --accent-soft: #f5ebe5;
  --naver: #03c75a;
  --naver-dark: #02a84c;

  --sans: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
    "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
  --serif: "Nanum Myeongjo", "Apple SD Gothic Neo", "Batang", "바탕", Georgia, serif;

  --wrap: 1200px;
  --radius: 4px;
  --radius-lg: 10px;

  --shadow: 0 1px 2px rgba(35, 32, 28, 0.04), 0 8px 24px rgba(35, 32, 28, 0.06);
}

/* ---------- reset ---------- */
*,
*::before,
*::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  word-break: keep-all;
}

img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }

h1, h2, h3, h4 {
  font-family: var(--serif);
  font-weight: 700;
  line-height: 1.35;
  letter-spacing: -0.01em;
  margin: 0;
}

p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

/* ---------- layout ---------- */
.wrap {
  width: 100%;
  max-width: var(--wrap);
  margin-inline: auto;
  padding-inline: 24px;
}

.section { padding-block: 88px; }
.section--tight { padding-block: 56px; }
.section--alt { background: var(--surface-2); }

.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 36px;
}

.eyebrow {
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 10px;
}

.section-title { font-size: 30px; }
.section-desc {
  color: var(--ink-2);
  font-size: 15px;
  margin-top: 10px;
  max-width: 56ch;
}

.skip-link {
  position: absolute;
  left: -9999px;
}
.skip-link:focus {
  left: 16px; top: 16px;
  z-index: 100;
  background: var(--ink);
  color: #fff;
  padding: 10px 16px;
  border-radius: var(--radius);
}

/* ---------- buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 13px 24px;
  border: 1px solid transparent;
  border-radius: var(--radius);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
  cursor: pointer;
  transition: background-color 0.18s ease, color 0.18s ease, border-color 0.18s ease;
  text-align: center;
}

.btn--primary { background: var(--ink); color: #fff; }
.btn--primary:hover { background: #3a352e; }

.btn--ghost {
  background: transparent;
  border-color: var(--line-2);
  color: var(--ink);
}
.btn--ghost:hover { border-color: var(--ink); background: rgba(35, 32, 28, 0.03); }

/* 네이버 그린은 구매 버튼에서만 쓴다. 다른 UI로 번지면 실 색과 충돌한다. */
.btn--naver { background: var(--naver); color: #fff; }
.btn--naver:hover { background: var(--naver-dark); }

.btn--block { width: 100%; }
.btn--lg { padding: 16px 30px; font-size: 15px; }

.btn[disabled],
.btn--disabled {
  background: var(--surface-3);
  color: var(--ink-3);
  cursor: not-allowed;
  pointer-events: none;
  border-color: transparent;
}

.link-more {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-2);
  border-bottom: 1px solid var(--line-2);
  padding-bottom: 2px;
  white-space: nowrap;
}
.link-more:hover { color: var(--ink); border-color: var(--ink); }

/* ---------- header ---------- */
.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(250, 248, 245, 0.92);
  backdrop-filter: saturate(140%) blur(8px);
  border-bottom: 1px solid var(--line);
}

.header-inner {
  display: flex;
  align-items: center;
  gap: 32px;
  height: 68px;
}

.logo {
  font-family: var(--serif);
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -0.02em;
  flex-shrink: 0;
}
.logo em { font-style: italic; color: var(--accent); }

.nav {
  display: flex;
  gap: 28px;
  margin-right: auto;
  font-size: 15px;
}
.nav a { color: var(--ink-2); padding-block: 6px; }
.nav a:hover,
.nav a[aria-current="page"] { color: var(--ink); }

.header-cta { padding: 10px 18px; }

.nav-toggle {
  display: none;
  margin-left: auto;
  background: none;
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  padding: 8px 14px;
  font-size: 14px;
  cursor: pointer;
}

@media (max-width: 860px) {
  .header-inner { height: 60px; gap: 12px; }
  .nav-toggle { display: block; }
  .nav {
    position: absolute;
    inset: 100% 0 auto 0;
    flex-direction: column;
    gap: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 8px 24px 20px;
    display: none;
  }
  .nav[data-open="true"] { display: flex; }
  .nav a { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .header-cta { display: none; }
}

/* ---------- 실타래 플레이스홀더 ----------
   실제 제품 사진이 들어오기 전까지 컬러웨이 hex로 실타래를 그린다.
   사진이 준비되면 .skein 을 <img> 로 교체하면 된다. */
.skein-frame {
  position: relative;
  aspect-ratio: 4 / 5;
  background: var(--surface-2);
  display: grid;
  place-items: center;
  overflow: hidden;
  border-radius: var(--radius);
}

.skein {
  position: relative;
  overflow: hidden; /* 라벨 밴드가 실타래 밖으로 삐져나오지 않게 */
  width: 68%;
  aspect-ratio: 1 / 1.12;
  border-radius: 46% / 38%;
  background:
    repeating-linear-gradient(114deg,
      rgba(255, 255, 255, 0.22) 0 2px,
      rgba(255, 255, 255, 0) 2px 6px,
      rgba(0, 0, 0, 0.07) 6px 8px,
      rgba(0, 0, 0, 0) 8px 13px),
    repeating-linear-gradient(66deg,
      rgba(255, 255, 255, 0.14) 0 2px,
      rgba(255, 255, 255, 0) 2px 7px,
      rgba(0, 0, 0, 0.05) 7px 9px,
      rgba(0, 0, 0, 0) 9px 15px),
    var(--c, #ccc);
  box-shadow:
    inset 0 -14px 30px rgba(0, 0, 0, 0.16),
    inset 0 10px 24px rgba(255, 255, 255, 0.2),
    0 10px 26px rgba(35, 32, 28, 0.1);
}

/* 실타래 라벨 밴드 */
.skein::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 44%;
  height: 13%;
  background: rgba(255, 255, 255, 0.88);
  border-block: 1px solid rgba(0, 0, 0, 0.05);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
}

.skein--lg { width: 60%; }

/* ---------- 제품 카드 ---------- */
.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 40px 28px;
}

.product-card { display: flex; flex-direction: column; }
.product-card .skein-frame { transition: transform 0.3s ease; }
.product-card:hover .skein-frame { transform: translateY(-4px); }

.card-brand {
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-top: 16px;
}

.card-name {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 700;
  margin-top: 4px;
}

.card-meta {
  font-size: 13px;
  color: var(--ink-2);
  margin-top: 6px;
}

.card-price {
  font-size: 14px;
  font-weight: 600;
  margin-top: 8px;
}

/* 컬러칩: 원형이 아니라 둥근 사각형. 실 색 면적이 더 넓게 보인다. */
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 12px;
}

.chip {
  width: 22px;
  height: 22px;
  border-radius: 5px;
  border: 1px solid rgba(0, 0, 0, 0.12);
  background: var(--c);
  flex-shrink: 0;
}

.chip-more {
  font-size: 12px;
  color: var(--ink-3);
  align-self: center;
  margin-left: 2px;
}

.badge {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 2;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.02em;
  padding: 5px 10px;
  border-radius: 999px;
  background: var(--ink);
  color: #fff;
}
.badge--incoming { background: var(--accent); }
.badge--sold { background: var(--ink-3); }
.badge--new { background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); }

/* ---------- hero ---------- */
.hero {
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  overflow: hidden;
}

.hero-inner {
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  gap: 60px;
  align-items: center;
  padding-block: 96px;
}

.hero h1 {
  font-size: clamp(34px, 4.6vw, 54px);
  line-height: 1.28;
  letter-spacing: -0.03em;
}

.hero p {
  color: var(--ink-2);
  margin-top: 24px;
  font-size: 17px;
  max-width: 44ch;
}

.hero-actions {
  display: flex;
  gap: 12px;
  margin-top: 36px;
  flex-wrap: wrap;
}

/* 히어로 실타래 3개 겹치기 */
.hero-art {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  align-items: center;
}
.hero-art .skein { width: 100%; }
.hero-art > div:nth-child(1) { transform: translateY(-26px) rotate(-5deg); }
.hero-art > div:nth-child(3) { transform: translateY(26px) rotate(5deg); }

@media (max-width: 860px) {
  .hero-inner {
    grid-template-columns: 1fr;
    gap: 44px;
    padding-block: 56px;
  }
  .hero-art { max-width: 320px; }
  .section { padding-block: 60px; }
}

/* ---------- 브랜드 스트립 ---------- */
.brand-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}

.brand-strip a {
  background: var(--bg);
  padding: 30px 16px;
  text-align: center;
  transition: background-color 0.18s ease;
}
.brand-strip a:hover { background: var(--surface); }

.brand-strip .bs-name {
  font-family: var(--serif);
  font-size: 17px;
  font-weight: 700;
}
.brand-strip .bs-country {
  font-size: 12px;
  color: var(--ink-3);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: 4px;
}

/* ---------- 색 계열 큐레이션 ---------- */
.family-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 12px;
}

.family-tile {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  background: var(--surface);
  transition: border-color 0.18s ease;
}
.family-tile:hover { border-color: var(--ink); }

.family-swatches {
  display: flex;
  gap: 4px;
  margin-bottom: 12px;
}
.family-swatches span {
  height: 34px;
  flex: 1;
  border-radius: 4px;
  border: 1px solid rgba(0, 0, 0, 0.1);
}

.family-name { font-size: 14px; font-weight: 600; }
.family-count { font-size: 12px; color: var(--ink-3); }

/* ---------- 3분할 값 제안 ---------- */
.value-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 40px;
}
.value-item h3 { font-size: 19px; margin-bottom: 10px; }
.value-item p { color: var(--ink-2); font-size: 15px; }
.value-num {
  font-family: var(--serif);
  font-size: 13px;
  color: var(--accent);
  letter-spacing: 0.1em;
  margin-bottom: 14px;
}

/* ---------- 구독 배너 ---------- */
.subscribe {
  background: var(--ink);
  color: #fff;
  border-radius: var(--radius-lg);
  padding: 56px 48px;
  text-align: center;
}
.subscribe h2 { font-size: 27px; color: #fff; }
.subscribe p {
  color: rgba(255, 255, 255, 0.7);
  margin-top: 12px;
  font-size: 15px;
}

.subscribe-form {
  display: flex;
  gap: 8px;
  max-width: 440px;
  margin: 28px auto 0;
}

.subscribe-form input {
  flex: 1;
  min-width: 0;
  padding: 13px 16px;
  border: 1px solid rgba(255, 255, 255, 0.25);
  background: rgba(255, 255, 255, 0.07);
  color: #fff;
  border-radius: var(--radius);
  font-size: 14px;
  font-family: inherit;
}
.subscribe-form input::placeholder { color: rgba(255, 255, 255, 0.45); }
.subscribe-form .btn { background: #fff; color: var(--ink); flex-shrink: 0; }
.subscribe-form .btn:hover { background: rgba(255, 255, 255, 0.86); }

.form-note {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.5);
  margin-top: 14px;
}

@media (max-width: 560px) {
  .subscribe { padding: 40px 24px; }
  .subscribe-form { flex-direction: column; }
}

/* ---------- footer ---------- */
.site-footer {
  border-top: 1px solid var(--line);
  padding-block: 56px 40px;
  margin-top: 0;
  background: var(--surface-2);
}

.footer-top {
  display: grid;
  grid-template-columns: 1.4fr 1fr 1fr 1fr;
  gap: 40px;
  padding-bottom: 40px;
  border-bottom: 1px solid var(--line-2);
}

.footer-col h4 {
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 16px;
  font-weight: 600;
}
.footer-col li { margin-bottom: 9px; font-size: 14px; }
.footer-col a { color: var(--ink-2); }
.footer-col a:hover { color: var(--ink); }

.footer-brand p {
  color: var(--ink-2);
  font-size: 14px;
  margin-top: 12px;
  max-width: 34ch;
}

.biz-info {
  font-size: 12.5px;
  color: var(--ink-3);
  line-height: 1.9;
  padding-top: 28px;
}
.biz-info .biz-row span { margin-right: 18px; white-space: nowrap; }
.copyright { margin-top: 14px; }

@media (max-width: 860px) {
  .footer-top { grid-template-columns: 1fr 1fr; gap: 32px; }
  .footer-brand { grid-column: 1 / -1; }
}

/* ---------- 카탈로그 ---------- */
.page-head {
  border-bottom: 1px solid var(--line);
  padding-block: 48px 40px;
  background: var(--surface-2);
}
.page-head h1 { font-size: 36px; }
.page-head p { color: var(--ink-2); margin-top: 12px; max-width: 60ch; }

.catalog-layout {
  display: grid;
  grid-template-columns: 232px 1fr;
  gap: 48px;
  align-items: start;
  padding-block: 48px 96px;
}

.filters { position: sticky; top: 92px; }

.filter-group { border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 20px; }
.filter-group:last-of-type { border-bottom: 0; }

.filter-group h3 {
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 12px;
  font-weight: 600;
}

.filter-opt {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 14px;
  color: var(--ink-2);
  padding: 5px 0;
  cursor: pointer;
}
.filter-opt input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
.filter-opt:hover { color: var(--ink); }
.filter-opt .sw {
  width: 15px; height: 15px;
  border-radius: 4px;
  border: 1px solid rgba(0, 0, 0, 0.14);
}

.catalog-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 28px;
  flex-wrap: wrap;
}
.result-count { font-size: 14px; color: var(--ink-2); }
.result-count strong { color: var(--ink); }

.sort-select {
  padding: 9px 14px;
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  background: var(--surface);
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
}

.empty-state {
  text-align: center;
  padding: 90px 20px;
  color: var(--ink-3);
}
.empty-state h3 { font-size: 20px; color: var(--ink); margin-bottom: 10px; }

.filter-toggle { display: none; }

@media (max-width: 900px) {
  .catalog-layout { grid-template-columns: 1fr; gap: 24px; padding-block: 32px 64px; }
  .filters {
    position: static;
    display: none;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    background: var(--surface);
  }
  .filters[data-open="true"] { display: block; }
  .filter-toggle { display: inline-flex; }
}

/* ---------- 제품 상세 ---------- */
.detail-layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 64px;
  padding-block: 48px 96px;
  align-items: start;
}

.detail-media { position: sticky; top: 92px; }
.detail-media .skein-frame { aspect-ratio: 1 / 1; border-radius: var(--radius-lg); }

.swatch-note {
  font-size: 12.5px;
  color: var(--ink-3);
  margin-top: 12px;
  text-align: center;
}

.breadcrumb { font-size: 13px; color: var(--ink-3); margin-bottom: 14px; }
.breadcrumb a:hover { color: var(--ink); }
.breadcrumb span { margin-inline: 6px; }

.detail-brand {
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.detail-title { font-size: 34px; margin-top: 8px; }
.detail-desc { color: var(--ink-2); margin-top: 18px; font-size: 15.5px; }

.detail-price {
  font-size: 22px;
  font-weight: 700;
  margin-top: 22px;
  font-family: var(--serif);
}
.detail-price small {
  font-size: 13px;
  font-weight: 400;
  color: var(--ink-3);
  font-family: var(--sans);
  margin-left: 8px;
}

.colorway-block { margin-top: 34px; }
.colorway-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 12px;
}
.colorway-label { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; }
.colorway-current { font-size: 13px; color: var(--ink-2); }

.colorway-grid { display: flex; flex-wrap: wrap; gap: 9px; }

.cw {
  width: 42px;
  height: 42px;
  border-radius: 7px;
  border: 1px solid rgba(0, 0, 0, 0.14);
  background: var(--c);
  cursor: pointer;
  padding: 0;
  position: relative;
  transition: transform 0.15s ease;
}
.cw:hover { transform: scale(1.06); }
.cw[aria-pressed="true"] {
  box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--ink);
}
.cw[data-stock="sold_out"] { opacity: 0.4; }

.buy-block { margin-top: 32px; display: flex; flex-direction: column; gap: 10px; }
.buy-note { font-size: 12.5px; color: var(--ink-3); text-align: center; }

/* 스펙 표는 접지 않는다. 중급 뜨개인은 이걸 보고 산다. */
.spec-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 36px;
  font-size: 14.5px;
}
.spec-table caption {
  text-align: left;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 600;
  padding-bottom: 12px;
}
.spec-table th,
.spec-table td {
  text-align: left;

/* =========================================================
   marie yarn — 공통 스크립트
   모든 페이지에서 data.js 다음에 로드된다.

   각 페이지 스크립트는 initXxx() 함수를 노출한다.
   멀티 페이지에서는 DOMContentLoaded 때 한 번 실행되고,
   단일 파일 미리보기(tools/build-preview.js)에서는 화면을 바꿀 때마다
   라우터가 다시 호출한다.
   ========================================================= */

/* ---------- 유틸 ---------- */

function esc(str) {
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

function won(n) {
  return typeof n === "number" ? n.toLocaleString("ko-KR") + "원" : "가격 문의";
}

function getBrand(slug) {
  return BRANDS.find((b) => b.slug === slug);
}

function getProduct(slug) {
  return PRODUCTS.find((p) => p.slug === slug);
}

/** [{메리노울,80},{실크,20}] → "메리노울 80% · 실크 20%" */
function fiberText(fiber) {
  return fiber.map((f) => `${f.material} ${f.percent}%`).join(" · ");
}

function weightLabel(w) {
  return WEIGHT_LABELS[w] || w;
}

/* ---------- 주소 쿼리 ----------
   멀티 페이지에서는 ?slug=... , 미리보기에서는 #product?slug=... 로 들어온다.
   양쪽 모두에서 같은 코드가 동작하도록 여기서 흡수한다. */

function urlParams() {
  const hash = location.hash;
  const q = hash.indexOf("?");
  if (q !== -1) return new URLSearchParams(hash.slice(q + 1));
  return new URLSearchParams(location.search);
}

function setUrlQuery(qs) {
  if (window.PREVIEW_MODE) {
    const base = (location.hash.split("?")[0] || "#home");
    history.replaceState(null, "", qs ? `${base}?${qs}` : base);
  } else {
    history.replaceState(null, "", qs ? `?${qs}` : location.pathname);
  }
}

/* ---------- 네이버 스토어 연결 ----------
   제품별 상품 URL이 있으면 그쪽으로, 없으면 스토어 메인으로 보낸다.
   나중에 네이버페이 결제형 API로 바꿀 때 이 함수만 교체하면 된다. */
function naverUrl(product) {
  return product && product.naverProductUrl ? product.naverProductUrl : SITE.naverStoreUrl;
}

/* ---------- 대표 색상 고르기 ----------
   목록에서 첫 번째 색을 그대로 쓰면 대개 아이보리라 카드가 전부 하얗게 보인다.
   가장 채도가 높은 색을 대표로 세워야 목록에서 실이 구분된다.
   실제 대표 사진이 준비되면 이 함수는 필요 없어진다. */
function chroma(hex) {
  const n = parseInt(hex.replace("#", ""), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return Math.max(r, g, b) - Math.min(r, g, b);
}

function coverColorway(p) {
  const pool = p.colorways.filter((c) => c.stock !== "sold_out");
  const list = pool.length ? pool : p.colorways;
  return list.reduce((best, c) => (chroma(c.hex) > chroma(best.hex) ? c : best), list[0]);
}

/* ---------- 실타래 플레이스홀더 ----------
   실제 사진이 준비되면 아래 innerHTML을 <img>로 교체한다. */
function skeinFrame(hex, label, opts = {}) {
  const badge = opts.badge || "";
  const big = opts.large ? " skein--lg" : "";
  return `
    <div class="skein-frame">
      ${badge}
      <div class="skein${big}" style="--c:${esc(hex)}" role="img" aria-label="${esc(label)}"></div>
    </div>`;
}

function stockBadge(stock) {
  if (stock === "incoming") return '<span class="badge badge--incoming">입고 예정</span>';
  if (stock === "sold_out") return '<span class="badge badge--sold">품절</span>';
  if (stock === "discontinued") return '<span class="badge badge--sold">단종</span>';
  return "";
}

/* ---------- 컬러칩 ---------- */
function chipsMarkup(colorways, max = 8) {
  const shown = colorways.slice(0, max);
  const rest = colorways.length - shown.length;
  const chips = shown
    .map((c) => `<span class="chip" style="--c:${esc(c.hex)}" title="${esc(c.name)}"></span>`)
    .join("");
  return `<div class="chips" aria-label="색상 ${colorways.length}종">${chips}${
    rest > 0 ? `<span class="chip-more">+${rest}</span>` : ""
  }</div>`;
}

/* ---------- 링크 ----------
   미리보기에서는 페이지 이동이 해시로 바뀐다. */
function href(page, query) {
  const qs = query ? `?${query}` : "";
  return window.PREVIEW_MODE ? `#${page}${qs}` : `${page}.html${qs}`;
}

/* ---------- 제품 카드 ---------- */
function productCard(p) {
  const brand = getBrand(p.brandSlug);
  const cover = coverColorway(p);
  return `
    <a class="product-card" href="${href("product", "slug=" + encodeURIComponent(p.slug))}">
      ${skeinFrame(cover.hex, `${p.name} 실타래`, { badge: stockBadge(p.stock) })}
      <p class="card-brand">${esc(brand ? brand.name : "")}</p>
      <h3 class="card-name">${esc(p.name)}</h3>
      <p class="card-meta">${esc(weightLabel(p.yarnWeight))} · ${esc(fiberText(p.fiber))}</p>
      <p class="card-meta">${p.weightGram}g / ${p.lengthMeter}m</p>
      <p class="card-price">${won(p.retailPrice)}</p>
      ${chipsMarkup(p.colorways)}
    </a>`;
}

/* ---------- 구매 버튼 ----------
   재고 상태에 따라 CTA가 달라진다.
   판매 중 → 네이버 스토어 / 입고 예정 → 알림 / 품절 → 문의 */
function buyBlock(p) {
  const url = esc(naverUrl(p));
  if (p.stock === "in_stock") {
    return `
      <a class="btn btn--naver btn--lg btn--block" href="${url}" target="_blank" rel="noopener">
        네이버 스토어에서 구매
      </a>
      <a class="btn btn--ghost btn--block" href="${href("contact")}">이 실 문의하기</a>
      <p class="buy-note">결제는 네이버 스마트스토어에서 진행됩니다. 새 창으로 열립니다.</p>`;
  }
  if (p.stock === "incoming") {
    return `
      <button class="btn btn--primary btn--lg btn--block" data-subscribe-scroll>입고 알림 받기</button>
      <a class="btn btn--ghost btn--block" href="${url}" target="_blank" rel="noopener">
        네이버 스토어 둘러보기
      </a>
      <p class="buy-note">입고되면 등록하신 이메일로 가장 먼저 알려드립니다.</p>`;
  }
  return `
    <span class="btn btn--lg btn--block btn--disabled">품절</span>
    <a class="btn btn--ghost btn--block" href="${href("contact")}">재입고 문의하기</a>`;
}

/* =========================================================
   공통 초기화
   화면이 바뀔 때마다 다시 불려도 안전해야 한다.
   ========================================================= */

function initCommon(scope) {
  scope = scope || document;

  /* 네이버 스토어 · 인스타그램 링크는 SITE 한 곳에서 관리 */
  scope.querySelectorAll("[data-naver-store]").forEach((el) => {
    el.setAttribute("href", SITE.naverStoreUrl);
  });
  scope.querySelectorAll("[data-instagram]").forEach((el) => {
    el.setAttribute("href", SITE.instagram);
  });

  /* 사업자정보 — 값이 바뀌면 data.js 만 고치면 된다 */
  const biz = document.querySelector("[data-biz]");
  if (biz && !biz.dataset.filled) {
    const b = SITE.business;
    biz.dataset.filled = "1";
    biz.innerHTML = `
      <div class="biz-row">
        <span>상호 ${esc(b.company)}</span>
        <span>대표 ${esc(b.ceo)}</span>
        <span>사업자등록번호 ${esc(b.regNo)}</span>
      </div>
      <div class="biz-row">
        <span>주소 ${esc(b.address)}</span>
        <span>이메일 ${esc(SITE.email)}</span>
      </div>
      <p class="copyright">© ${new Date().getFullYear()} ${esc(SITE.name)}. All rights reserved.</p>`;
  }

  /* 구독 폼 — 아직 백엔드가 없다 */
  scope.querySelectorAll("[data-subscribe-form]").forEach((form) => {
    if (form.dataset.bound) return;
    form.dataset.bound = "1";
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const note = form.parentElement.querySelector(".form-note");
      if (note) {
        note.textContent =
          "폼은 아직 연동 전입니다. 메일 발송(스티비·메일침프 등) 연결이 필요합니다.";
      }
    });
  });
}

/* 한 번만 걸면 되는 이벤트 */
function bindGlobalHandlers() {
  const toggle = document.querySelector(".nav-toggle");
  const nav = document.getElementById("nav");
  if (toggle && nav) {
    toggle.addEventListener("click", () => {
      const open = nav.getAttribute("data-open") === "true";
      nav.setAttribute("data-open", String(!open));
      toggle.setAttribute("aria-expanded", String(!open));
    });
  }

  /* 상세 페이지의 '입고 알림 받기' → 하단 구독 폼으로 */
  document.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-subscribe-scroll]");
    if (!btn) return;
    const target = document.getElementById("subscribe");
    if (target) {
      target.scrollIntoView({ behavior: "smooth", block: "center" });
      const input = target.querySelector("input");
      if (input) setTimeout(() => input.focus(), 400);
    }
  });
}

document.addEventListener("DOMContentLoaded", () => {
  bindGlobalHandlers();
  initCommon(document);
});

/* 홈 화면 렌더링 */

function initHome() {
  /* 히어로 실타래 — 대표 색 3개 */
  const art = document.getElementById("hero-art");
  if (art) {
    const picks = ["#ddceb6", "#7d8560", "#a8613f"];
    art.innerHTML = picks
      .map(
        (hex) =>
          `<div><div class="skein" style="--c:${hex}" role="presentation"></div></div>`
      )
      .join("");
  }

  /* 취급 브랜드 */
  const strip = document.getElementById("brand-strip");
  if (strip) {
    strip.innerHTML = BRANDS.map(
      (b) => `
      <a href="${href("brands", "b=" + encodeURIComponent(b.slug))}">
        <div class="bs-name">${esc(b.name)}</div>
        <div class="bs-country">${esc(b.country)}</div>
      </a>`
    ).join("");
  }

  /* 추천 실 */
  const featured = document.getElementById("featured-products");
  if (featured) {
    featured.innerHTML = PRODUCTS.filter((p) => p.featured).map(productCard).join("");
  }

  /* 색 계열 큐레이션 — 클릭하면 카탈로그 필터로 이어진다 */
  const familyGrid = document.getElementById("family-grid");
  if (familyGrid) {
    const counts = {};
    const swatches = {};

    PRODUCTS.forEach((p) => {
      const seen = new Set();
      p.colorways.forEach((c) => {
        if (!seen.has(c.colorFamily)) {
          seen.add(c.colorFamily);
          counts[c.colorFamily] = (counts[c.colorFamily] || 0) + 1;
        }
        (swatches[c.colorFamily] = swatches[c.colorFamily] || []).push(c.hex);
      });
    });

    const families = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).slice(0, 6);

    familyGrid.innerHTML = families
      .map((f) => {
        const sw = swatches[f]
          .slice(0, 3)
          .map((hex) => `<span style="background:${esc(hex)}"></span>`)
          .join("");
        return `
        <a class="family-tile" href="${href("products", "family=" + encodeURIComponent(f))}">
          <div class="family-swatches">${sw}</div>
          <div class="family-name">${esc(FAMILY_LABELS[f] || f)}</div>
          <div class="family-count">${counts[f]}종의 실</div>
        </a>`;
      })
      .join("");
  }
}

/* =========================================================
   제품 카탈로그 — 필터 · 정렬
   필터 상태를 주소에 반영해서 공유와 뒤로가기가 동작하게 한다.
   ========================================================= */

function initCatalog() {
  const grid = document.getElementById("catalog-grid");
  if (!grid) return;

  const filterEl = document.getElementById("filters");
  const countEl = document.getElementById("result-count");
  const sortEl = document.getElementById("sort");
  const toggleEl = document.getElementById("filter-toggle");

  /* ---------- 필터 옵션 구성 (데이터에서 자동 추출) ---------- */

  const usedWeights = WEIGHT_ORDER.filter((w) => PRODUCTS.some((p) => p.yarnWeight === w));

  const usedMaterials = [
    ...new Set(PRODUCTS.flatMap((p) => p.fiber.map((f) => f.material))),
  ].sort();

  const familyHex = {};
  const usedFamilies = [];
  PRODUCTS.forEach((p) =>
    p.colorways.forEach((c) => {
      if (!familyHex[c.colorFamily]) {
        familyHex[c.colorFamily] = c.hex;
        usedFamilies.push(c.colorFamily);
      }
    })
  );

  function group(title, key, options) {
    return `
      <div class="filter-group">
        <h3>${esc(title)}</h3>
        ${options
          .map(
            (o) => `
          <label class="filter-opt">
            <input type="checkbox" data-key="${key}" value="${esc(o.value)}">
            ${o.swatch ? `<span class="sw" style="background:${esc(o.swatch)}"></span>` : ""}
            <span>${esc(o.label)}</span>
          </label>`
          )
          .join("")}
      </div>`;
  }

  filterEl.innerHTML = [
    group("브랜드", "brand", BRANDS.map((b) => ({ value: b.slug, label: b.name }))),
    group(
      "굵기",
      "weight",
      usedWeights.map((w) => ({ value: w, label: weightLabel(w) }))
    ),
    group("소재", "material", usedMaterials.map((m) => ({ value: m, label: m }))),
    group(
      "색 계열",
      "family",
      usedFamilies.map((f) => ({
        value: f,
        label: FAMILY_LABELS[f] || f,
        swatch: familyHex[f],
      }))
    ),
    group("상태", "stock", [
      { value: "in_stock", label: "판매 중" },
      { value: "incoming", label: "입고 예정" },
    ]),
    '<button class="btn btn--ghost btn--block" id="reset-filters" type="button">필터 초기화</button>',
  ].join("");

  /* ---------- 주소 ↔ 필터 동기화 ---------- */

  const KEYS = ["brand", "weight", "material", "family", "stock"];

  function readUrl() {
    const q = urlParams();
    const state = {};
    KEYS.forEach((k) => {
      const raw = q.get(k);
      state[k] = raw ? raw.split(",").filter(Boolean) : [];
    });
    state.sort = q.get("sort") || "new";
    return state;
  }

  function writeUrl(state) {
    const q = new URLSearchParams();
    KEYS.forEach((k) => {
      if (state[k].length) q.set(k, state[k].join(","));
    });
    if (state.sort !== "new") q.set("sort", state.sort);
    setUrlQuery(q.toString());
  }

  function applyStateToInputs(state) {
    filterEl.querySelectorAll("input[type=checkbox]").forEach((input) => {
      input.checked = state[input.dataset.key].includes(input.value);
    });
    if (sortEl) sortEl.value = state.sort;
  }

  function readInputs() {
    const state = {};
    KEYS.forEach((k) => (state[k] = []));
    filterEl.querySelectorAll("input[type=checkbox]:checked").forEach((input) => {
      state[input.dataset.key].push(input.value);
    });
    state.sort = sortEl ? sortEl.value : "new";
    return state;
  }

  /* ---------- 필터링 ---------- */

  function matches(p, state) {
    if (state.brand.length && !state.brand.includes(p.brandSlug)) return false;
    if (state.weight.length && !state.weight.includes(p.yarnWeight)) return false;
    if (state.stock.length && !state.stock.includes(p.stock)) return false;

    if (state.material.length) {
      const mats = p.fiber.map((f) => f.material);
      if (!state.material.some((m) => mats.includes(m))) return false;
    }

    if (state.family.length) {
      const fams = p.colorways.map((c) => c.colorFamily);
      if (!state.family.some((f) => fams.includes(f))) return false;
    }

    return true;
  }

  function sortList(list, sort) {
    const out = [...list];
    if (sort === "name") out.sort((a, b) => a.name.localeCompare(b.name));
    else if (sort === "price_asc") out.sort((a, b) => a.retailPrice - b.retailPrice);
    else if (sort === "price_desc") out.sort((a, b) => b.retailPrice - a.retailPrice);
    else out.sort((a, b) => b.releasedAt.localeCompare(a.releasedAt));
    return out;
  }

  function render() {
    const state = readInputs();
    writeUrl(state);

    const list = sortList(PRODUCTS.filter((p) => matches(p, state)), state.sort);

    countEl.innerHTML = `총 <strong>${list.length}</strong>개의 실`;

    grid.innerHTML = list.length
      ? list.map(productCard).join("")
      : `<div class="empty-state">
           <h3>조건에 맞는 실이 없습니다</h3>
           <p>필터를 줄여서 다시 찾아보세요.</p>
         </div>`;

    grid.classList.toggle("product-grid", list.length > 0);
  }

  /* ---------- 이벤트 ---------- */

  filterEl.addEventListener("change", render);
  if (sortEl) sortEl.addEventListener("change", render);

  filterEl.addEventListener("click", (e) => {
    if (!e.target.closest("#reset-filters")) return;
    filterEl.querySelectorAll("input[type=checkbox]").forEach((i) => (i.checked = false));
    if (sortEl) sortEl.value = "new";
    render();
  });

  if (toggleEl) {
    toggleEl.addEventListener("click", () => {
      const open = filterEl.getAttribute("data-open") === "true";
      filterEl.setAttribute("data-open", String(!open));
      toggleEl.setAttribute("aria-expanded", String(!open));
    });
  }

  applyStateToInputs(readUrl());
  render();
}

document.addEventListener("DOMContentLoaded", initCatalog);

/* =========================================================
   제품 상세 — product.html?slug=fjord-merino
   ========================================================= */

function initProductDetail() {
  const root = document.getElementById("detail-root");
  if (!root) return;

  const slug = urlParams().get("slug");
  const p = slug ? getProduct(slug) : null;

  if (!p) {
    root.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1">
        <h3>찾으시는 실이 없습니다</h3>
        <p>주소가 잘못되었거나 판매가 종료된 제품입니다.</p>
        <p style="margin-top:24px"><a class="btn btn--ghost" href="${href("products")}">전체 제품 보기</a></p>
      </div>`;
    const section = document.getElementById("related-section");
    if (section) section.hidden = true;
    return;
  }

  const brand = getBrand(p.brandSlug);
  document.title = `${p.name} — ${brand ? brand.name : ""} | ${SITE.name}`;
  const metaDesc = document.querySelector('meta[name="description"]');
  if (metaDesc) metaDesc.setAttribute("content", p.description.slice(0, 150));

  /* 목록 카드에서 보던 색과 같은 색으로 열려야 한다 */
  let current = coverColorway(p);

  /* ---------- 필요 볼 수 (참고값) ----------
     완성품별 대략적인 소요 실 길이를 볼 수로 환산한다. */
  const NEEDS = [
    { name: "목도리", meters: 400 },
    { name: "비니", meters: 200 },
    { name: "성인 스웨터", meters: 1200 },
  ];

  function ballHint() {
    const items = NEEDS.map(
      (n) => `${n.name} 약 ${Math.ceil(n.meters / p.lengthMeter)}볼`
    ).join(" · ");
    return `
      <div class="usage-hint">
        <strong>얼마나 필요할까요?</strong>
        ${esc(items)}
        <br>1볼 ${p.lengthMeter}m 기준으로 계산한 참고값입니다. 게이지와 사이즈에 따라 달라집니다.
      </div>`;
  }

  /* ---------- 스펙 표 ---------- */
  function specTable() {
    const rows = [
      ["소재", fiberText(p.fiber)],
      ["중량 / 실 길이", `${p.weightGram}g / ${p.lengthMeter}m (1볼)`],
      ["굵기", `${weightLabel(p.yarnWeight)} (${p.yarnWeight})`],
      ["권장 게이지", p.gauge],
      ["권장 대바늘", p.needleSize],
      ["권장 코바늘", p.hookSize || "—"],
      ["세탁 방법", p.careInstructions],
      ["원산지", p.origin],
    ];
    return `
      <table class="spec-table">
        <caption>제품 사양</caption>
        <tbody>
          ${rows
            .map(([k, v]) => `<tr><th scope="row">${esc(k)}</th><td>${esc(v)}</td></tr>`)
            .join("")}
        </tbody>
      </table>`;
  }

  /* ---------- 렌더 ---------- */
  function render() {
    root.innerHTML = `
      <div class="detail-media">
        ${skeinFrame(current.hex, `${p.name} ${current.name} 실타래`, {
          large: true,
          badge: stockBadge(p.stock),
        })}
        <p class="swatch-note">
          화면 색과 실물 색은 차이가 있을 수 있습니다. 실물 스와치 사진은 준비 중입니다.
        </p>
      </div>

      <div class="detail-info">
        <nav class="breadcrumb" aria-label="위치">
          <a href="${href("products")}">제품</a><span>/</span>
          <a href="${href("brands", "b=" + encodeURIComponent(p.brandSlug))}">${esc(brand ? brand.name : "")}</a><span>/</span>
          ${esc(p.name)}
        </nav>

        <p class="detail-brand">${esc(brand ? brand.name : "")} · ${esc(brand ? brand.country : "")}</p>
        <h1 class="detail-title">${esc(p.name)}</h1>
        <p class="detail-desc">${esc(p.description)}</p>

        <p class="detail-price">
          ${won(p.retailPrice)}
          <small>1볼 ${p.weightGram}g 기준</small>
        </p>

        <div class="colorway-block">
          <div class="colorway-head">
            <span class="colorway-label">색상 ${p.colorways.length}종</span>
            <span class="colorway-current" id="cw-current"></span>
          </div>
          <div class="colorway-grid" id="cw-grid"></div>
        </div>

        <div class="buy-block">${buyBlock(p)}</div>

        ${ballHint()}
        ${specTable()}
      </div>`;

    renderColorways();
  }

  function renderColorways() {
    const grid = document.getElementById("cw-grid");
    const label = document.getElementById("cw-current");

    grid.innerHTML = p.colorways
      .map(
        (c) => `
        <button class="cw"
                style="--c:${esc(c.hex)}"
                data-code="${esc(c.code)}"
                data-stock="${esc(c.stock)}"
                aria-pressed="${c.code === current.code}"
                title="${esc(c.name)} (${esc(c.code)})">
          <span class="sr-only">${esc(c.name)}</span>
        </button>`
      )
      .join("");

    label.textContent =
      `${current.name} · ${current.code}` +
      (current.stock === "sold_out" ? " (품절)" : "");

    grid.querySelectorAll(".cw").forEach((btn) => {
      btn.addEventListener("click", () => {
        current = p.colorways.find((c) => c.code === btn.dataset.code);
        /* 실타래 색만 바꾸면 되므로 전체를 다시 그리지 않는다 */
        const skein = root.querySelector(".detail-media .skein");
        if (skein) {
          skein.style.setProperty("--c", current.hex);
          skein.setAttribute("aria-label", `${p.name} ${current.name} 실타래`);
        }
        renderColorways();
      });
    });
  }

  render();

  /* ---------- 같은 브랜드의 다른 실 ---------- */
  const related = document.getElementById("related-grid");
  const section = document.getElementById("related-section");
  if (related) {
    const list = PRODUCTS.filter((x) => x.brandSlug === p.brandSlug && x.slug !== p.slug);
    related.innerHTML = list.map(productCard).join("");
    if (section) section.hidden = list.length === 0;
    const head = document.getElementById("related-title");
    if (head) head.textContent = `${brand ? brand.name : ""}의 다른 실`;
  }
}

/* 문의 페이지 — 탭 전환 및 폼 처리 */

function initContact() {
  /* 연락처 정보는 data.js 한 곳에서 관리 */
  const emailEl = document.querySelector("[data-site-email]");
  if (emailEl) {
    emailEl.innerHTML = `<a class="link-more" href="mailto:${esc(SITE.email)}">${esc(SITE.email)}</a>`;
  }

  const hoursEl = document.querySelector("[data-site-hours]");
  if (hoursEl) hoursEl.textContent = SITE.hours;

  /* 도매 문의의 관심 브랜드 목록 */
  const brandSelect = document.querySelector("[data-brand-options]");
  if (brandSelect && !brandSelect.dataset.filled) {
    brandSelect.dataset.filled = "1";
    brandSelect.insertAdjacentHTML(
      "beforeend",
      BRANDS.map((b) => `<option value="${esc(b.slug)}">${esc(b.name)}</option>`).join("")
    );
  }

  /* ---------- 탭 ---------- */
  const tabs = [
    { tab: document.getElementById("tab-general"), panel: document.getElementById("panel-general") },
    { tab: document.getElementById("tab-wholesale"), panel: document.getElementById("panel-wholesale") },
  ].filter((t) => t.tab && t.panel);

  if (!tabs.length) return;

  function select(index) {
    tabs.forEach((t, i) => {
      t.tab.setAttribute("aria-selected", String(i === index));
      t.panel.hidden = i !== index;
    });
  }

  tabs.forEach((t, i) => t.tab.addEventListener("click", () => select(i)));

  /* ?type=wholesale 로 들어오면 도매 탭부터 */
  select(urlParams().get("type") === "wholesale" ? 1 : 0);

  /* ---------- 폼 제출 ----------
     아직 백엔드가 없다. 연동 전까지는 안내만 띄운다. */
  document.querySelectorAll("[data-contact-form]").forEach((form) => {
    if (form.dataset.bound) return;
    form.dataset.bound = "1";
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const notice = form.querySelector(".notice");
      if (notice) {
        notice.textContent =
          "문의 폼은 아직 연동 전입니다. 메일 발송 연동(Formspree·Resend 등)이 필요합니다. " +
          "당장은 " + SITE.email + " 으로 보내주세요.";
        notice.setAttribute("data-show", "true");
      }
    });
  });
}

document.addEventListener("DOMContentLoaded", initContact);

좋습니다</th>\n            </tr>\n          </thead>\n          <tbody>\n            <tr><td>Lace</td><td>레이스</td><td>2.0 – 3.5mm</td><td>28 – 32코</td><td>숄, 합사용</td></tr>\n            <tr><td>Fingering</td><td>핑거링</td><td>2.25 – 3.25mm</td><td>28 – 32코</td><td>양말, 얇은 가디건</td></tr>\n            <tr><td>Sport</td><td>스포츠</td><td>3.0 – 3.75mm</td><td>24 – 26코</td><td>봄가을 상의, 아기 옷</td></tr>\n            <tr><td>DK</td><td>DK</td><td>3.75 – 4.5mm</td><td>21 – 24코</td><td>가장 무난한 스웨터</td></tr>\n            <tr><td>Worsted</td><td>워스티드</td><td>4.5 – 5.5mm</td><td>16 – 20코</td><td>겉옷, 두꺼운 스웨터</td></tr>\n            <tr><td>Bulky</td><td>벌키</td><td>6.0 – 9.0mm</td><td>12 – 15코</td><td>목도리, 빠르게 뜨는 겉옷</td></tr>\n            <tr><td>Jumbo</td><td>점보</td><td>10mm 이상</td><td>7코 이하</td><td>블랭킷, 쿠션</td></tr>\n          </tbody>\n        </table>\n      </div>\n\n      <h3>처음이라면 DK</h3>\n      <p>\n        너무 가늘면 진도가 안 나가고, 너무 굵으면 조직이 성겨 보입니다.\n        DK 굵기는 뜨는 속도와 완성도가 가장 균형 잡혀 있어 첫 스웨터에 적당합니다.\n      </p>\n\n      <h2>2. 소재를 정합니다</h2>\n      <p>같은 굵기라도 소재에 따라 입었을 때가 완전히 다릅니다.</p>\n\n      <div class=\"table-scroll\">\n        <table class=\"data-table\">\n          <thead>\n            <tr>\n              <th scope=\"col\">소재</th>\n              <th scope=\"col\">특징</th>\n              <th scope=\"col\">주의할 점</th>\n            </tr>\n          </thead>\n          <tbody>\n            <tr>\n              <td>메리노울</td>\n              <td>탄력이 좋아 조직이 또렷하게 살아납니다. 무늬뜨기에 적합합니다.</td>\n              <td>세탁 시 줄어들 수 있어 손세탁을 권합니다.</td>\n            </tr>\n            <tr>\n              <td>알파카</td>\n              <td>가볍고 따뜻하며 은은한 광택이 있습니다.</td>\n              <td>늘어지는 성질이 있어 긴 옷은 무게를 고려해야 합니다.</td>\n            </tr>\n            <tr>\n              <td>캐시미어</td>\n              <td>부드러움이 압도적입니다. 피부에 닿는 옷에 좋습니다.</td>\n              <td>보풀이 생기기 쉽고 가격대가 높습니다.</td>\n            </tr>\n            <tr>\n              <td>모헤어</td>\n              <td>잔털이 퍼지며 부피감을 만듭니다. 합사하면 분위기가 확 바뀝니다.</td>\n              <td>한번 뜨면 풀기 어렵습니다. 게이지를 미리 확인하세요.</td>\n            </tr>\n            <tr>\n              <td>코튼</td>\n              <td>통기성이 좋고 세탁이 편합니다. 여름 옷에 적합합니다.</td>\n              <td>탄력이 없어 늘어납니다. 손목이 아플 수 있습니다.</td>\n            </tr>\n            <tr>\n              <td>린넨</td>\n              <td>쓸수록 부드러워지고 색이 오래갑니다.</td>\n              <td>처음엔 뻣뻣합니다. 완성 후 한 번 세탁하면 달라집니다.</td>\n            </tr>\n          </tbody>\n        </table>\n      </div>\n\n      <h2>3. 게이지 읽는 법</h2>\n      <p>\n        제품 페이지의 <strong>10 × 10cm = 22코 30단</strong>은\n        \"권장 바늘로 10cm 사방을 뜨면 가로 22코, 세로 30단이 나온다\"는 뜻입니다.\n      </p>\n      <ul>\n        <li>도안의 게이지와 실의 게이지가 맞아야 도안대로 사이즈가 나옵니다.</li>\n        <li>같은 실이라도 뜨는 사람의 손 힘에 따라 게이지가 달라집니다.</li>\n        <li>옷을 뜬다면 <strong>반드시 스와치를 먼저 떠서</strong> 본인 게이지를 확인하세요.</li>\n        <li>코 수가 많으면(= 조직이 촘촘하면) 바늘을 한 호수 올려보세요.</li>\n      </ul>\n\n      <h2>4. 얼마나 사야 할까</h2>\n      <p>실 길이(m) 기준으로 계산합니다. 대략적인 소요량은 다음과 같습니다.</p>\n      <ul>\n        <li>목도리 — 약 400m</li>\n        <li>비니 — 약 200m</li>\n        <li>성인 스웨터 — 약 1,000 – 1,400m</li>\n      </ul>\n      <p>\n        각 제품 페이지에 1볼 길이를 기준으로 환산한 필요 볼 수를 표시해 두었습니다.\n        염색 배치가 달라지면 미묘한 색 차이가 생길 수 있으니,\n        <strong>한 작품에 쓸 실은 한 번에 구매하시길 권합니다.</strong>\n      </p>\n\n      <h2>5. 세탁 표기</h2>\n      <ul>\n        <li><strong>손세탁</strong> — 미지근한 물에 눌러 빨고, 비틀지 말고 눌러서 물기를 뺍니다.</li>\n        <li><strong>울코스 세탁 가능</strong> — 세탁망에 넣고 30℃ 이하 울코스로 돌립니다.</li>\n        <li><strong>뉘어서 건조</strong> — 걸어서 말리면 무게 때문에 늘어납니다. 반드시 눕혀서 말립니다.</li>\n      </ul>\n\n      <p style=\"margin-top:40px\">\n        <a class=\"btn btn--primary\" href=\"#products\">이제 실을 골라볼까요</a>\n      </p>\n    </div>","about":"<div class=\"page-head\">\n      <div class=\"wrap\">\n        <h1>손으로 만져보고 떠본 실만</h1>\n        <p>marie yarn이 실을 고르는 기준과 일하는 방식입니다.</p>\n      </div>\n    </div>\n\n    <div class=\"wrap prose\">\n      <h2>왜 수입을 시작했나</h2>\n      <p>\n        좋은 도안은 많은데 그 도안에 맞는 실을 국내에서 구하기 어려웠습니다.\n        해외 직구를 하자니 배송비가 실값을 넘고, 색은 화면으로만 봐야 했습니다.\n        \"이 실을 국내에서 편하게 살 수 있으면 좋겠다\"는 생각에서 시작했습니다.\n      </p>\n\n      <h2>실을 고르는 기준</h2>\n      <h3>방적소를 직접 봅니다</h3>\n      <p>\n        중간 유통을 거치지 않고 방적소와 직접 계약합니다.\n        그래야 염색 배치 정보, 재입고 일정, 단종 예정을 정확히 파악할 수 있습니다.\n        고객에게 \"언제 들어오는지 모릅니다\"라고 답하고 싶지 않았습니다.\n      </p>\n\n      <h3>수입 전에 직접 떠봅니다</h3>\n      <p>\n        모든 실은 계약 전에 스와치를 떠봅니다.\n        라벨에 적힌 게이지와 실제로 떠본 게이지가 다르면, 다른 대로 제품 페이지에 적습니다.\n        세탁 후 줄어드는 정도도 확인합니다.\n      </p>\n\n      <h3>오래 취급합니다</h3>\n      <p>\n        한 시즌 팔고 접는 실은 들여오지 않습니다.\n        작품을 뜨다가 실이 모자랐을 때 같은 색을 다시 구할 수 없다면,\n        그건 실을 판 쪽의 책임이라고 생각합니다.\n      </p>\n\n      <h2>스펙을 숨기지 않습니다</h2>\n      <p>\n        소재 구성 비율, 1볼 실 길이, 권장 게이지, 권장 바늘 호수, 세탁 방법, 원산지.\n        모든 제품 페이지에 이 정보를 빠짐없이 공개합니다.\n        사고 나서 알게 되는 정보가 없어야 한다는 것이 원칙입니다.\n      </p>\n      <p>\n        화면의 색과 실물 색이 다를 수 있다는 점도 그대로 적습니다.\n        색이 중요한 작업이라면 문의를 주세요. 실물 샘플을 보내드립니다.\n      </p>\n\n      <h2>뜨개방 · 공방을 운영하신다면</h2>\n      <p>\n        도매 거래를 진행합니다. 최소 주문 수량과 거래 조건은 취급 브랜드에 따라 다르므로\n        문의 페이지의 도매 문의 탭으로 연락 주세요.\n      </p>\n\n      <p style=\"margin-top:40px; display:flex; gap:10px; flex-wrap:wrap\">\n        <a class=\"btn btn--primary\" href=\"#products\">제품 보기</a>\n        <a class=\"btn btn--ghost\" href=\"#contact\">문의하기</a>\n      </p>\n    </div>","contact":"<div class=\"page-head\">\n      <div class=\"wrap\">\n        <h1>문의</h1>\n        <p>\n          주문·배송 문의는 구매하신 네이버 스토어를 통해 주시면 더 빠릅니다.\n          실 자체에 대한 질문과 도매 거래 문의는 이곳으로 보내주세요.\n        </p>\n      </div>\n    </div>\n\n    <div class=\"wrap form-layout\">\n      <div>\n        <div class=\"tabs\" role=\"tablist\">\n          <button class=\"tab\" type=\"button\" role=\"tab\" id=\"tab-general\"\n                  aria-selected=\"true\" aria-controls=\"panel-general\">일반 문의</button>\n          <button class=\"tab\" type=\"button\" role=\"tab\" id=\"tab-wholesale\"\n                  aria-selected=\"false\" aria-controls=\"panel-wholesale\">도매 · 취급 문의</button>\n        </div>\n\n        <!-- 일반 문의 -->\n        <form id=\"panel-general\" role=\"tabpanel\" aria-labelledby=\"tab-general\" data-contact-form>\n          <div class=\"field-row\">\n            <div class=\"field\">\n              <label for=\"g-name\">이름<span class=\"req\">*</span></label>\n              <input id=\"g-name\" name=\"name\" type=\"text\" required>\n            </div>\n            <div class=\"field\">\n              <label for=\"g-email\">이메일<span class=\"req\">*</span></label>\n              <input id=\"g-email\" name=\"email\" type=\"email\" required>\n            </div>\n          </div>\n\n          <div class=\"field\">\n            <label for=\"g-type\">문의 유형</label>\n            <select id=\"g-type\" name=\"type\">\n              <option>실 스펙 · 게이지 문의</option>\n              <option>색상 · 실물 샘플 문의</option>\n              <option>재입고 문의</option>\n              <option>기타</option>\n            </select>\n          </div>\n\n          <div class=\"field\">\n            <label for=\"g-message\">문의 내용<span class=\"req\">*</span></label>\n            <textarea id=\"g-message\" name=\"message\" required\n              placeholder=\"어떤 실의 어떤 점이 궁금하신지 적어주세요. 뜨려는 작품을 함께 알려주시면 더 정확히 답변드릴 수 있습니다.\"></textarea>\n          </div>\n\n          <label class=\"consent\">\n            <input type=\"checkbox\" required>\n            <span>\n              문의 답변을 위한 개인정보(이름, 이메일) 수집·이용에 동의합니다.\n              자세한 내용은 <a href=\"#privacy\">개인정보처리방침</a>을 확인해 주세요.\n            </span>\n          </label>\n\n          <button class=\"btn btn--primary btn--lg\" type=\"submit\">문의 보내기</button>\n          <p class=\"notice notice--warn\"></p>\n        </form>\n\n        <!-- 도매 문의 -->\n        <form id=\"panel-wholesale\" role=\"tabpanel\" aria-labelledby=\"tab-wholesale\" data-contact-form hidden>\n          <div class=\"field-row\">\n            <div class=\"field\">\n              <label for=\"w-company\">상호<span class=\"req\">*</span></label>\n              <input id=\"w-company\" name=\"company\" type=\"text\" required>\n            </div>\n            <div class=\"field\">\n              <label for=\"w-regno\">사업자등록번호<span class=\"req\">*</span></label>\n              <input id=\"w-regno\" name=\"regno\" type=\"text\" placeholder=\"000-00-00000\" required>\n            </div>\n          </div>\n\n          <div class=\"field-row\">\n            <div class=\"field\">\n              <label for=\"w-name\">담당자<span class=\"req\">*</span></label>\n              <input id=\"w-name\" name=\"name\" type=\"text\" required>\n            </div>\n            <div class=\"field\">\n              <label for=\"w-phone\">연락처<span class=\"req\">*</span></label>\n              <input id=\"w-phone\" name=\"phone\" type=\"tel\" required>\n            </div>\n          </div>\n\n          <div class=\"field\">\n            <label for=\"w-email\">이메일<span class=\"req\">*</span></label>\n            <input id=\"w-email\" name=\"email\" type=\"email\" required>\n          </div>\n\n          <div class=\"field\">\n            <label for=\"w-brand\">관심 브랜드</label>\n            <select id=\"w-brand\" name=\"brand\" data-brand-options>\n              <option value=\"\">전체</option>\n            </select>\n          </div>\n\n          <div class=\"field\">\n            <label for=\"w-message\">문의 내용<span class=\"req\">*</span></label>\n            <textarea id=\"w-message\" name=\"message\" required\n              placeholder=\"예상 발주 수량, 매장 위치, 희망 입고 시기 등을 적어주시면 조건 안내가 빠릅니다.\"></textarea>\n          </div>\n\n          <label class=\"consent\">\n            <input type=\"checkbox\" required>\n            <span>\n              거래 상담을 위한 개인정보 수집·이용에 동의합니다.\n              자세한 내용은 <a href=\"#privacy\">개인정보처리방침</a>을 확인해 주세요.\n            </span>\n          </label>\n\n          <button class=\"btn btn--primary btn--lg\" type=\"submit\">도매 문의 보내기</button>\n          <p class=\"notice notice--warn\"></p>\n        </form>\n      </div>\n\n      <aside class=\"side-card\">\n        <h3>다른 방법으로 연락하기</h3>\n        <dl>\n          <dt>이메일</dt>\n          <dd data-site-email></dd>\n          <dt>운영 시간</dt>\n          <dd data-site-hours></dd>\n          <dt>주문 · 배송</dt>\n          <dd><a class=\"link-more\" data-naver-store href=\"#\" target=\"_blank\" rel=\"noopener\">네이버 스토어 문의하기</a></dd>\n          <dt>인스타그램</dt>\n          <dd><a class=\"link-more\" data-instagram href=\"#\" target=\"_blank\" rel=\"noopener\">@marieyarn</a></dd>\n        </dl>\n      </aside>\n    </div>","faq":"<div class=\"page-head\">\n      <div class=\"wrap\">\n        <h1>자주 묻는 질문</h1>\n        <p>여기에 없는 내용은 <a class=\"link-more\" href=\"#contact\">문의 페이지</a>로 보내주세요.</p>\n      </div>\n    </div>\n\n    <div class=\"wrap prose\">\n      <h2>구매</h2>\n\n      <h3>이 사이트에서 바로 살 수 있나요?</h3>\n      <p>\n        결제는 네이버 스마트스토어에서 진행됩니다.\n        제품 페이지의 <strong>네이버 스토어에서 구매</strong> 버튼을 누르면 해당 상품 페이지로 이동합니다.\n        네이버페이 포인트와 적립도 그대로 적용됩니다.\n      </p>\n\n      <h3>가격이 스토어와 다른데요?</h3>\n      <p>\n        이 사이트의 가격은 정가 기준입니다.\n        네이버 스토어에서 진행 중인 할인이나 쿠폰이 있으면 실제 결제 금액은 더 낮을 수 있습니다.\n        최종 금액은 스토어 페이지를 확인해 주세요.\n      </p>\n\n      <h2>배송 · 교환</h2>\n\n      <h3>배송은 얼마나 걸리나요?</h3>\n      <p>\n        네이버 스토어 기준으로 안내됩니다. 주문·배송·교환·반품 문의는\n        구매하신 스토어의 문의하기를 이용하시면 가장 빠릅니다.\n      </p>\n\n      <h3>실을 뜯었는데 교환할 수 있나요?</h3>\n      <p>\n        라벨을 제거했거나 감긴 실을 푼 경우에는 교환·반품이 어렵습니다.\n        색이나 굵기가 걱정되신다면 구매 전에 문의를 주세요. 실물 샘플을 보내드립니다.\n      </p>\n\n      <h2>제품</h2>\n\n      <h3>화면 색과 실물 색이 같나요?</h3>\n      <p>\n        다를 수 있습니다. 모니터와 기기에 따라 색 표현이 달라지고,\n        염색 배치에 따라 같은 색상 코드라도 미세한 차이가 생깁니다.\n        색이 중요한 작업이라면 실물 샘플을 요청해 주세요.\n      </p>\n\n      <h3>한 작품에 쓸 실은 어떻게 사야 하나요?</h3>\n      <p>\n        <strong>한 번에, 같은 배치로 구매하시길 권합니다.</strong>\n        나중에 추가로 사면 염색 배치가 달라져 색이 미묘하게 어긋날 수 있습니다.\n        필요한 볼 수는 각 제품 페이지에 참고값으로 표시해 두었습니다.\n      </p>\n\n      <h3>품절된 색은 언제 다시 들어오나요?</h3>\n      <p>\n        수입 일정에 따라 다르지만 보통 2~3개월 주기입니다.\n        입고 알림을 신청해 두시면 재입고 시 이메일로 가장 먼저 알려드립니다.\n      </p>\n\n      <h2>도매 거래</h2>\n\n      <h3>뜨개방을 운영하는데 도매 거래가 가능한가요?</h3>\n      <p>\n        가능합니다. 사업자등록증을 보유한 매장·공방을 대상으로 진행합니다.\n        최소 주문 수량과 거래 조건은 브랜드마다 다르므로\n        <a class=\"link-more\" href=\"#contact?type=wholesale\">도매 문의</a>로 연락 주세요.\n      </p>\n\n      <h3>온라인 판매도 가능한가요?</h3>\n      <p>\n        브랜드별로 온라인 재판매 정책이 다릅니다. 문의 시 판매 채널을 함께 알려주시면\n        가능 여부를 확인해 안내드리겠습니다.\n      </p>\n    </div>","privacy":"<div class=\"page-head\">\n      <div class=\"wrap\">\n        <h1>개인정보처리방침</h1>\n        <p>marie yarn은 이용자의 개인정보를 소중히 다룹니다.</p>\n      </div>\n    </div>\n\n    <div class=\"wrap prose\">\n      <div class=\"usage-hint\" style=\"margin-bottom:40px\">\n        <strong>⚠️ 오픈 전 반드시 완성해야 하는 페이지입니다</strong>\n        아래는 항목 구조만 잡아둔 초안입니다. 문의 폼과 구독 폼에서 개인정보를 수집하는 이상\n        이 방침은 사이트 공개 전에 실제 내용으로 채워져야 합니다.\n        보유 기간, 수탁업체, 개인정보 보호책임자는 실제 운영 방식에 맞춰 작성해야 하며,\n        확정 전 법무 검토를 권합니다.\n      </div>\n\n      <h2>1. 수집하는 개인정보 항목</h2>\n      <ul>\n        <li>문의 시 — 이름, 이메일 주소, 문의 내용</li>\n        <li>도매 문의 시 — 상호, 사업자등록번호, 담당자명, 연락처, 이메일</li>\n        <li>입고 알림 신청 시 — 이메일 주소</li>\n        <li>자동 수집 — 접속 IP, 브라우저 정보, 방문 기록 (웹 분석 도구 사용 시)</li>\n      </ul>\n\n      <h2>2. 개인정보의 수집·이용 목적</h2>\n      <ul>\n        <li>문의에 대한 답변 및 상담</li>\n        <li>도매 거래 조건 안내 및 상담</li>\n        <li>재입고 및 신규 상품 정보 발송 (동의한 경우에 한함)</li>\n        <li>서비스 개선을 위한 통계 분석</li>\n      </ul>\n\n      <h2>3. 보유 및 이용 기간</h2>\n      <p>\n        수집 목적이 달성되면 지체 없이 파기합니다.\n        다만 관계 법령에 따라 보존이 필요한 경우 해당 기간 동안 보관합니다.\n      </p>\n      <ul>\n        <li>문의 기록 — 답변 완료 후 O년</li>\n        <li>구독 정보 — 구독 해지 시까지</li>\n      </ul>\n\n      <h2>4. 개인정보의 제3자 제공</h2>\n      <p>\n        이용자의 동의 없이 개인정보를 제3자에게 제공하지 않습니다.\n        다만 법령에 따라 요구되는 경우는 예외로 합니다.\n      </p>\n\n      <h2>5. 개인정보 처리의 위탁</h2>\n      <p>\n        서비스 운영을 위해 아래 업체에 개인정보 처리를 위탁하고 있습니다.\n        (실제 사용하는 메일 발송 서비스, 호스팅 업체 등을 기재해야 합니다.)\n      </p>\n\n      <h2>6. 이용자의 권리</h2>\n      <p>\n        이용자는 언제든지 자신의 개인정보에 대한 열람, 정정, 삭제, 처리 정지를 요청할 수 있습니다.\n        요청은 아래 연락처로 보내주시면 지체 없이 처리하겠습니다.\n      </p>\n\n      <h2>7. 개인정보 보호책임자</h2>\n      <ul>\n        <li>성명 — OOO</li>\n        <li>이메일 — <span data-privacy-email></span></li>\n      </ul>\n\n      <h2>8. 방침의 변경</h2>\n      <p>\n        이 개인정보처리방침은 시행일로부터 적용되며,\n        변경 사항이 있을 경우 시행 7일 전부터 공지사항을 통해 안내합니다.\n      </p>\n      <p>시행일 — 0000년 00월 00일</p>\n    </div>"};
const TITLES = {"home":"marie yarn — 해외 뜨개실 수입 · 유통","products":"전체 제품 — marie yarn","product":"제품 상세 — marie yarn","brands":"취급 브랜드 — marie yarn","guide":"실 고르기 가이드 — marie yarn","about":"회사 소개 — marie yarn","contact":"문의 — marie yarn","faq":"자주 묻는 질문 — marie yarn","privacy":"개인정보처리방침 — marie yarn"};
const INITS = {"home":"initHome","products":"initCatalog","product":"initProductDetail","brands":"initBrands","contact":"initContact","privacy":"initPrivacy"};

/* privacy.html 안에 있던 인라인 스크립트를 여기로 옮겨 담는다 */
function initPrivacy() {
  const el = document.querySelector("[data-privacy-email]");
  if (el) el.textContent = SITE.email;
}

function currentRoute() {
  const raw = location.hash.replace(/^#/, "");
  const name = raw.split("?")[0];
  return TEMPLATES[name] ? name : "home";
}

function renderRoute() {
  const name = currentRoute();
  const main = document.getElementById("main");

  main.innerHTML = TEMPLATES[name];
  document.title = TITLES[name];

  /* 네비게이션 현재 위치 표시 */
  document.querySelectorAll("#nav a").forEach((a) => {
    const target = (a.getAttribute("href") || "").replace(/^#/, "").split("?")[0];
    if (target === name) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });

  /* 모바일 메뉴가 열려 있으면 닫는다 */
  const nav = document.getElementById("nav");
  if (nav) nav.setAttribute("data-open", "false");

  window.scrollTo(0, 0);

  initCommon(main);
  const fn = INITS[name];
  if (fn && typeof window[fn] === "function") window[fn]();
}

window.addEventListener("hashchange", renderRoute);
renderRoute();
</script>
